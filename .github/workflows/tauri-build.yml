name: Build Hermes Desktop
on:
  push:
    branches: [feat/tauri-desktop]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: deb
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: msi

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            wget

      - name: Extract linuxdeploy (no FUSE needed on CI)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p ~/.local/bin

          # Extract linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root ~/.local/bin/linuxdeploy-extracted
          ln -s ~/.local/bin/linuxdeploy-extracted/AppRun ~/.local/bin/linuxdeploy

          # Linuxdeploy plugin - appimagetool (for creating final AppImage)
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root ~/.local/bin/appimagetool-extracted
          ln -s ~/.local/bin/appimagetool-extracted/AppRun ~/.local/bin/appimagetool

          # Download Tauri's plugins
          wget -q https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -O ~/.local/bin/linuxdeploy-plugin-gtk.sh
          wget -q https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh -O ~/.local/bin/linuxdeploy-plugin-gstreamer.sh

          chmod +x ~/.local/bin/*
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          echo "✅ linuxdeploy + appimagetool extracted (no FUSE needed)"

      - name: Install system deps (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # macOS has built-in WebKit, no extra deps needed
          echo "macOS ready"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Hermes Desktop
        working-directory: .
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Desktop-Linux
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Desktop-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Desktop-Windows
          path: src-tauri/target/release/bundle/msi/*.msi
