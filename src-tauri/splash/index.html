<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0908;
      color: #EAE0D5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      text-align: center;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #C6AC8F;
    }
    p {
      font-size: 13px;
      color: #8A9BA8;
    }
    .spinner {
      margin: 24px auto 0;
      width: 32px;
      height: 32px;
      border: 3px solid #22333B;
      border-top: 3px solid #C6AC8F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">⚡</div>
    <h1>Hermes Desktop</h1>
    <p>Starting Hermes Agent...</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
